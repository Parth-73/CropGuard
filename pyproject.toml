[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cropguard"
version = "0.1.0"
description = "Trainable crop and weed instance segmentation for images and video"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<13", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
ml = ["ultralytics>=8.3.0,<9", "opencv-python>=4.10,<5", "lap>=0.5.12"]
dev = ["pytest>=8,<10"]

[project.scripts]
cropguard = "cropguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
